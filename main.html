<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Save Walter White</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img class="right-image" src="sww.jpg" width="" height="200">
    <img class="left-image" src="sww2.jpg" width="600" height="200">
        
    <div>
        <p>
            <span class="seasonNum">05</span>
            <span class="br">Br</span>eaking
        </p>
        <p class="bad">
            <span class="B" onclick="this.classList.toggle('donme'); document.querySelector('.login-screen').style.display = 'flex'">Ba</span>d
            <div class="plz-click">Please click here to save Walter White!
            <div class="up-arrow"></div>
        </div>
        </p>
    </div>

    <div class="login-screen">
        <div class="login-container">
            <div class="clock" id="clock">00:00:00</div> 
            <div class="Login">Login</div>
            <input type="text" placeholder="Username" />
            <input type="password" placeholder="Password" />
            <button>Login</button>
        </div>
    </div>

    <script>
        function updateClock() {
            let now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
        document.addEventListener('keydown', function(event) {
    // H tuşuna basıldığında
    if (event.key.toLowerCase() === 'h') {
        let loginScreen = document.querySelector('.login-screen');
        let badClassElement = document.querySelector('.bad'); // <p class="bad"> öğesini seç
        let plzClickElement = document.querySelector('.plz-click'); // <div class="plz-click"> öğesini seç
        let upArrowElement = document.querySelector('.up-arrow'); // <div class="up-arrow"> öğesini seç
        
        // Login ekranını gizle/göster
        if (loginScreen.style.display === 'flex') {
            loginScreen.style.display = 'none';
        } else {
            loginScreen.style.display = 'flex';
        }

        // .bad class'ını kontrol et ve göster/gizle
        if (badClassElement) {
            if (badClassElement.style.display === 'none') {
                badClassElement.style.display = 'block'; // tekrar göster
            } else {
                badClassElement.style.display = 'none'; // gizle
            }
        }

        // .plz-click class'ını kontrol et ve göster/gizle
        if (plzClickElement) {
            if (plzClickElement.style.display === 'none') {
                plzClickElement.style.display = 'block'; // tekrar göster
            } else {
                plzClickElement.style.display = 'none'; // gizle
            }
        }

        // .up-arrow class'ını kontrol et ve göster/gizle
        if (upArrowElement) {
            if (upArrowElement.style.display === 'none') {
                upArrowElement.style.display = 'block'; // tekrar göster
            } else {
                upArrowElement.style.display = 'none'; // gizle
            }
        }
    }
});

    </script>
</body>
</html>
